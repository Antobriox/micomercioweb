project_id = "micomercioweb-demo"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/recuperar", "http://127.0.0.1:3000/auth/recuperar", "http://localhost:3000/auth/correo", "http://127.0.0.1:3000/auth/correo"]
enable_signup = true
minimum_password_length = 12
jwt_expiry = 900

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 600
max_frequency = "1m"

[auth.rate_limit]
token_verifications = 30
token_refresh = 150

[auth.sessions]
timebox = "24h"

[auth.email.template.confirmation]
subject = "Código para verificar tu correo"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupera tu contraseña"
content_path = "./supabase/templates/recovery.html"
